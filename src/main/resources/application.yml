spring:
  application:
    name: incidentpilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/incidentpilot}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  http:
    client:
      connect-timeout: 10s
      read-timeout: 15m   # local CPU models can be slow; agent makes several tool calls
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      init:
        pull-model-strategy: when_missing   # downloads the models on first start
        timeout: 60m
        max-retries: 2
      chat:
        options:
          model: ${CHAT_MODEL:qwen2.5:7b}
          temperature: 0.1
          num-ctx: 8192
      embedding:
        options:
          model: ${EMBED_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
    mcp:
      server:
        name: incidentpilot-ops-tools
        version: 0.1.0

incidentpilot:
  mcp-default-snapshot: upload-timeout

management:
  endpoints:
    web:
      exposure:
        include: health,info
